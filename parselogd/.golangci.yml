version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gosec:
      excludes:
        - G304 # reading the queue_log path from configuration is the point
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/KrzysztofHajdamowicz/asternic-stats-lite
