version: 2
updates:
  - package-ecosystem: gomod
    directory: /parselogd
    schedule:
      interval: weekly
    groups:
      go-modules:
        update-types: [minor, patch]

  # Base images. php:8.5-* are floating tags (every build pulls the newest
  # patch release), so Dependabot only proposes moves to a new PHP branch.
  - package-ecosystem: docker
    directories:
      - /parselogd
      - /docker/web
      - /docker/parselog
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
