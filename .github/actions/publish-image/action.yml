name: Publish image
description: >
  Builds a multi-arch image and, outside pull requests, pushes it to GHCR with
  BuildKit provenance (mode=max) and SBOM attestations, plus GitHub build
  provenance and SBOM attestations (verify with gh attestation verify).
  The job needs the permissions contents: read, packages: write,
  id-token: write and attestations: write.

inputs:
  name:
    description: Image name under ghcr.io/<owner>/
    required: true
  description:
    description: org.opencontainers.image.description
    required: true
  context:
    description: Build context
    default: .
  file:
    description: Dockerfile path (default <context>/Dockerfile)
    default: ""
  build-args:
    description: >
      Build arguments, one per line. VERSION (the image version from the tags,
      e.g. 1.2.3, latest or pr-4) is always passed.
    default: ""
  platforms:
    default: linux/amd64,linux/arm64
  no-cache:
    description: Build without any layer cache
    default: "false"

outputs:
  digest:
    description: Digest of the pushed image index (empty in pull requests)
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: echo "ref=ghcr.io/${OWNER,,}/$NAME" >> "$GITHUB_OUTPUT"
      env:
        OWNER: ${{ github.repository_owner }}
        NAME: ${{ inputs.name }}

    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.image.outputs.ref }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=ref,event=pr
        labels: |
          org.opencontainers.image.title=${{ inputs.name }}
          org.opencontainers.image.description=${{ inputs.description }}

    - id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          ${{ inputs.build-args }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Always check the registry for a newer base image.
        pull: true
        no-cache: ${{ inputs.no-cache == 'true' }}
        cache-from: ${{ inputs.no-cache != 'true' && format('type=gha,scope={0}', inputs.name) || '' }}
        cache-to: ${{ inputs.no-cache != 'true' && format('type=gha,scope={0},mode=max', inputs.name) || '' }}
        # Attestations stored next to the image in the registry, one SBOM per
        # platform (docker buildx imagetools inspect --format '{{json .SBOM}}').
        provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
        sbom: ${{ github.event_name != 'pull_request' }}

    # SBOM of the linux/amd64 image: OS packages, PHP, Go modules and the
    # vendored libraries described in docker/sbom/.
    - uses: anchore/sbom-action@v0
      if: github.event_name != 'pull_request'
      with:
        image: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
        format: cyclonedx-json
        output-file: ${{ runner.temp }}/${{ inputs.name }}.cyclonedx.json
        artifact-name: ${{ inputs.name }}.cyclonedx.json
        registry-username: ${{ github.actor }}
        registry-password: ${{ github.token }}

    # SLSA build provenance (no sbom-path / predicate given).
    - uses: actions/attest@v4
      if: github.event_name != 'pull_request'
      with:
        subject-name: ${{ steps.image.outputs.ref }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
        # Storage records need an organization; this repository is a user's.
        create-storage-record: false

    - uses: actions/attest@v4
      if: github.event_name != 'pull_request'
      with:
        subject-name: ${{ steps.image.outputs.ref }}
        subject-digest: ${{ steps.build.outputs.digest }}
        sbom-path: ${{ runner.temp }}/${{ inputs.name }}.cyclonedx.json
        push-to-registry: true
        create-storage-record: false
