name: parselogd

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly rebuild picks up base image updates, and publishes dependency
    # updates merged by Dependabot auto-merge (merges made with GITHUB_TOKEN
    # do not trigger push workflows). Manual run after a security fix:
    #   gh workflow run parselogd.yml
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: parselogd

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: parselogd/go.mod
          cache-dependency-path: parselogd/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          PARSELOG_TEST_DSN: root:root@tcp(127.0.0.1:3306)/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: parselogd/go.mod
          cache-dependency-path: parselogd/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: parselogd

  image:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-image
        with:
          name: asternic-parselogd
          description: Imports the Asterisk queue_log into the Asternic Call Center Stats Lite database
          context: parselogd
          # Scheduled and manual runs rebuild from scratch (fresh base image).
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
