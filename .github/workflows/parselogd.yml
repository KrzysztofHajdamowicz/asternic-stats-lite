name: parselogd

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly rebuild picks up base image updates, and publishes dependency
    # updates merged by Dependabot auto-merge (merges made with GITHUB_TOKEN
    # do not trigger push workflows).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: parselogd

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: parselogd/go.mod
          cache-dependency-path: parselogd/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          PARSELOG_TEST_DSN: root:root@tcp(127.0.0.1:3306)/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: parselogd/go.mod
          cache-dependency-path: parselogd/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: parselogd

  image:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/asternic-parselogd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=asternic-parselogd
            org.opencontainers.image.description=Imports the Asterisk queue_log into the Asternic Call Center Stats Lite database
      - uses: docker/build-push-action@v7
        with:
          context: parselogd
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
