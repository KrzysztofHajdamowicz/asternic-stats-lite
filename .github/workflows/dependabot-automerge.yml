name: Dependabot auto-merge

# Turns on auto-merge for Dependabot PRs with patch and minor updates. The PR
# is merged by GitHub once the required status checks pass, so the branch
# protection rule for master must require the parselogd checks.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # A new PHP branch for the web/parselog images (php:8.5 -> 8.6) is left
      # for review: the image builds are not required checks.
      - if: >-
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
          && steps.meta.outputs.dependency-names != 'php'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Optional Dependabot secret with a token that can merge PRs. Merges
          # made with it trigger the push workflow, which publishes the image
          # right away; with GITHUB_TOKEN that happens at the weekly rebuild.
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
